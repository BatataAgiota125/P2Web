<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
:root{--a:#7c5cff;--bg:#e9e7f5;--fg:#17162b;--in:#fff}
[data-t=dark]{--bg:#16152a;--fg:#ecebff;--in:#0a0a14}
body{margin:0;height:48px;background:var(--bg);color:var(--fg);display:flex;align-items:center;gap:4px;padding:0 10px;font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
button{border:0;background:transparent;color:var(--fg);font-size:18px;width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0}
button:hover{background:rgba(128,128,128,.22)}
input{flex:1;height:34px;border:2px solid transparent;border-radius:12px;background:var(--in);color:var(--fg);padding:0 16px;font-size:14px;outline:0;margin:0 6px}
input:focus{border-color:var(--a)}
#who{font-size:13px;opacity:.8}
#av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),#22d3ee);background-size:cover;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
</style></head><body>
<button onclick="shell.cmd('back')" title="Voltar">←</button>
<button onclick="shell.cmd('forward')" title="Avançar">→</button>
<button onclick="shell.cmd('reload')" title="Recarregar">⟳</button>
<button onclick="shell.cmd('home')" title="Início"><svg width="24" height="24" viewBox="0 0 96 96"><rect width="96" height="96" rx="26" style="fill:var(--a)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M34 26V72M34 26H52a14 14 0 0 1 0 28H34" stroke-width="9"/><path d="M34 72L66 66" stroke-width="4" opacity=".75"/></g><circle cx="70" cy="65" r="6.5" fill="#fff"/></svg></button>
<input id="u" placeholder="Digite um endereço P2P (ex.: meusite)" spellcheck="false">
<span id="who"></span><button id="b" onclick="shell.cmd('home')" title="Perfil"><div id="av"></div></button>
<script>
const u=document.getElementById('u'),mq=matchMedia('(prefers-color-scheme: dark)');let last;
u.onkeydown=e=>{if(e.key==='Enter'){shell.nav(u.value);u.blur()}};
u.onfocus=()=>u.select();
shell.onUrl(x=>u.value=x);
function paint(s){last=s;const r=document.documentElement,t=s.settings.theme;
  r.style.setProperty('--a',s.settings.accent);r.dataset.t=t==='auto'?(mq.matches?'dark':'light'):t;
  const a=document.getElementById('av');a.style.backgroundImage=s.avatar?`url(${s.avatar})`:'';
  a.textContent=s.avatar||s.state==='none'?'':(s.name||'?')[0].toUpperCase();
  document.getElementById('who').textContent=s.state==='none'?'':s.name}
shell.onSession(paint);mq.onchange=()=>last&&paint(last);shell.onFocusUrl(()=>u.focus());
</script></body></html>
